services:
  seeder:
    build:
      context: .
      dockerfile: seeder.Dockerfile

      args:
        SEEDER_EXECUTE_ENV_PATH: ${SEEDER_EXECUTE_ENV_PATH}
        SEEDER_RPC_CALL_ENV_PATH: ${SEEDER_RPC_CALL_ENV_PATH}
        SEEDER_EXTERNAL_RPC_URL: ${SEEDER_EXTERNAL_RPC_URL}
        SEEDER_INTERNAL_RPC_URL: ${SEEDER_INTERNAL_RPC_URL}

        LIVENESS_PLATFORM: ${LIVENESS_PLATFORM}
        LIVENESS_SERVICE_PROVIDER: ${LIVENESS_SERVICE_PROVIDER}
        LIVENESS_RPC_URL: ${LIVENESS_RPC_URL}
        LIVENESS_WS_URL: ${LIVENESS_WS_URL}
        LIVENESS_CONTRACT_ADDRESS: ${LIVENESS_CONTRACT_ADDRESS}

    container_name: seeder

    environment:
      SEEDER_MODE: ${SEEDER_MODE}

    ports:
      - "10001:10001"
      - "10002:10002"

    volumes:
      - seeder_data:/app/seeder/data

    entrypoint: ["/app/seeder/scripts/seeder-entrypoint.sh"]

